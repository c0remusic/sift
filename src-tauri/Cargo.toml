[package]
name = "sift"
version = "0.0.1"
description = "Sift — prépa sons DJ"
authors = ["Sift"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
ffmpeg-sidecar = "2.5.0"
walkdir = "2.5.0"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-os = "2.3.2"
notify-debouncer-full = "0.7.0"
rustfft = "6.4.1"
lofty = "0.24"
open = "5"
rusty-chromaprint = "0.3"
symphonia = { version = "0.6", features = ["mp3", "flac", "wav", "aiff", "isomp4", "aac", "alac"] }
ureq = { version = "3", features = ["json"] }
dirs = "5"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
flate2 = "1.1.9"
base85 = "2.0.0"
rand = "0.8"
sysinfo = "0.39"
chrono = "0.4"
quick-xml = { version = "0.37", features = ["serialize"] }
percent-encoding = "2.3"
wmi = "0.18"
tempfile = "3.27.0"

# DwmExtendFrameIntoClientArea fix for the undecorated+transparent+resizable window's native
# resize-margin showing as a solid backdrop instead of true transparency (annotation: "on a des
# coins arrondis mais la fenetre affiche toujours une case sur windows"). Version pinned to match
# tauri's own `windows` dependency (2.11.x depends on "0.61") so HWND is the same type on both sides.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[dev-dependencies]

# Audio DSP is unusably slow in an unoptimised debug build (rustfft + per-sample loops).
# Optimise dependencies fully, and our own code lightly, while keeping dev compile fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
