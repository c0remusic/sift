name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job separe et independant du build des installeurs (pas de `needs:`) : un ratchet de style
  # qui casse ne doit jamais empecher la production/upload des binaires — trouve par verify-gate
  # (2026-07-24), le job `build` etait sequentiel et un echec de lint aurait bloque tauri build +
  # l'upload des artefacts sur main.
  lint-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm deps
        run: npm ci
      - name: Lint design tokens (ratchet — bloque sur toute nouvelle derive, pas sur la dette existante)
        run: npm run lint:tokens

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Fetch ffmpeg sidecar
        run: npm run fetch-ffmpeg

      - name: Build Tauri app (unsigned)
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sift-${{ matrix.triple }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
