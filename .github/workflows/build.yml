name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jeton en LECTURE SEULE par defaut. Un job qui doit ecrire (publication)
# redeclare ses propres permissions a son niveau, ou il herite de celles-ci.
permissions:
  contents: read

jobs:
  # Job separe et independant du build des installeurs (pas de `needs:`) : un ratchet de style
  # qui casse ne doit jamais empecher la production/upload des binaires — trouve par verify-gate
  # (2026-07-24), le job `build` etait sequentiel et un echec de lint aurait bloque tauri build +
  # l'upload des artefacts sur main.
  lint-tokens:
    runs-on: ubuntu-latest
    # Sans plafond, un job bloque consomme jusqu'a la limite du fournisseur (6 h).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm deps
        run: npm ci
      - name: Lint design tokens (ratchet — bloque sur toute nouvelle derive, pas sur la dette existante)
        run: npm run lint:tokens

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    # Sans plafond, un job bloque consomme jusqu'a la limite du fournisseur (6 h).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, epingle 2026-07-30

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, epingle 2026-07-30
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm deps
        run: npm ci

      # macOS construit ffmpeg depuis les sources (aucun build LGPL statique publie n'existe —
      # voir scripts/fetch-ffmpeg.mjs), ce qui coute plusieurs minutes. La cle porte sur le
      # contenu du script de build : changer la version epinglee ou un drapeau de configure
      # invalide le cache, ne rien changer le reutilise. Windows telecharge et ne passe pas ici.
      - name: Cache du ffmpeg macOS construit
        if: runner.os == 'macOS'
        id: ffmpeg-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, epingle 2026-08-02
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.triple }}-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}

      - name: Fetch ffmpeg sidecar
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: npm run fetch-ffmpeg

      - name: Build Tauri app (unsigned)
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sift-${{ matrix.triple }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
