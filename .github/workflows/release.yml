name: release

on:
  push:
    tags:
      - "v*.*.*"

# Jeton en LECTURE SEULE par defaut. Un job qui doit ecrire (publication)
# redeclare ses propres permissions a son niveau, ou il herite de celles-ci.
permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    # Sans plafond, un job bloque consomme jusqu'a la limite du fournisseur (6 h).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable, epingle 2026-07-30

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2, epingle 2026-07-30
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Fetch ffmpeg sidecar
        run: npm run fetch-ffmpeg

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0, epingle 2026-07-30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sift ${{ github.ref_name }}"
          releaseBody: "Voir les fichiers joints. Installation non signée : docs/install-non-signe.md."
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json
